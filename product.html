<section class="related-section" id="relatedSection" style="display:none">
  <div class="container">
    <div class="section-eyebrow" style="margin-bottom:var(--s6)"><span>More from Edition 001</span></div>
    <div class="products-grid" id="relatedGrid"></div>

</section>

      <p class="footer__hallmark">Edition 001 — Handcrafted</p>
    </div>
  </div>
</footer>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
const params = new URLSearchParams(location.search);
const productId = parseInt(params.get('id'));
const product = getProductById(productId);

if (!product) {
  document.getElementById('productLayout').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:var(--s9) 0">
      <p class="t-label" style="color:var(--white-dim);margin-bottom:var(--s5)">Product not found</p>
      <a href="shop.html" class="btn btn-outline">Back to Shop</a>
    </div>`;
} else {
  document.title = `${product.name} — THCD`;

  // Breadcrumb
  document.getElementById('breadcrumb').innerHTML = `
    <a href="index.html">Home</a>
    <span class="breadcrumb__sep">/</span>
    <a href="shop.html">Shop</a>
    <span class="breadcrumb__sep">/</span>
    <a href="shop.html?cat=${product.category}">${product.category.charAt(0).toUpperCase() + product.category.slice(1)}</a>
    <span class="breadcrumb__sep">/</span>
    <span>${product.name}</span>`;

  // Gallery
  let currentImg = 0;

  function buildGallery() {
    const thumbsHtml = product.images.map((img, i) => `
      <div class="gallery__thumb ${i === 0 ? 'active' : ''}" data-idx="${i}" onclick="setImage(${i})">
        <img src="${getImagePath(product.id, img)}" alt="${product.name} view ${i+1}" loading="lazy"/>
      </div>`).join('');

    return `
      <div class="gallery">
        <div class="gallery__main" id="galleryMain">
          <img id="mainImg" src="${getImagePath(product.id, product.images[0])}" alt="${product.name}"/>
          <div class="gallery__nav">
            <button class="gallery__nav-btn" onclick="prevImg()" aria-label="Previous">‹</button>
            <button class="gallery__nav-btn" onclick="nextImg()" aria-label="Next">›</button>
          </div>
          <div class="gallery__counter" id="galleryCounter">1 / ${product.images.length}</div>
        </div>
        <div class="gallery__thumbs" id="galleryThumbs">${thumbsHtml}</div>
      </div>`;
  }

  function setImage(idx) {
    if (idx === currentImg) return;
    const mainImg = document.getElementById('mainImg');
    mainImg.classList.add('fading');
    setTimeout(() => {
      mainImg.src = getImagePath(product.id, product.images[idx]);
      mainImg.classList.remove('fading');
    }, 150);
    currentImg = idx;
    document.querySelectorAll('.gallery__thumb').forEach((t, i) => {
      t.classList.toggle('active', i === idx);
    });
    document.getElementById('galleryCounter').textContent = `${idx + 1} / ${product.images.length}`;
  }

  function prevImg() {
    setImage((currentImg - 1 + product.images.length) % product.images.length);
  }
  function nextImg() {
    setImage((currentImg + 1) % product.images.length);
  }

  // Keyboard nav
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') prevImg();
    if (e.key === 'ArrowRight') nextImg();
  });

  // Touch swipe
  let touchX = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    if (touchX === null) return;
    const diff = touchX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) diff > 0 ? nextImg() : prevImg();
    touchX = null;
  });

  // Info panel
  const matTag = product.materialTag === 'gold'
    ? `<span class="tag tag-gold">18K Gold Vermeil</span>`
    : `<span class="tag tag-silver">925 Sterling Silver</span>`;
  const stockTag = product.inStock
    ? `<span class="tag tag-acid">In Stock</span>`
    : `<span class="tag tag-dim">Sold Out</span>`;
  const isNew = product.id <= 3 ? `<span class="tag tag-new">New</span>` : '';

  const sizesHtml = product.sizeNote ? `
    <div class="product-info__size-section">
      <p class="product-info__size-label">Size</p>
      <p style="font-family:var(--font-n);font-size:1rem;color:var(--text-black);letter-spacing:.08em;text-transform:uppercase;margin-bottom:var(--s5)">${product.sizeNote}</p>
    </div>` : '';

  const addBtnText = product.inStock ? 'Add to Cart ↗' : 'Sold Out';

  const infoHtml = `
    <div class="product-info">
      <div class="product-info__tags">
        ${matTag}
        ${stockTag}
        ${isNew}
      </div>
      <h1 class="product-info__name">${product.name}</h1>
      <p class="product-info__edition">${product.edition} &nbsp;·&nbsp; HALLMARK: ${product.hallmark}</p>
      <p class="product-info__material ${product.materialTag === 'gold' ? 'gold-text' : 'silver-text'}">${product.material}</p>
      <div class="product-info__price">
        <span class="t-price">€${product.price}</span>
      </div>
      <div class="product-info__desc" style="border-top:none;padding-top:0;margin-bottom:var(--s5)">
        <p style="font-size:1.05rem;line-height:1.75;color:var(--text-black)">${product.description}</p>
      </div>
      <div style="font-family:var(--font-m);font-size:.8rem;letter-spacing:.06em;color:var(--text-dim);line-height:2;margin-bottom:var(--s6);padding-bottom:var(--s6);border-bottom:1px solid var(--border-dark)">
        <div>Shipping worldwide — €10 &nbsp;·&nbsp; Sakartvelo — free</div>
        <div>Write directly: <a href="mailto:marina.marbl@gmail.com" style="color:var(--text-black)">marina.marbl@gmail.com</a> or <a href="https://www.instagram.com/th_c_d/" target="_blank" rel="noopener" style="color:var(--text-black)">@th_c_d</a></div>
      </div>
      ${sizesHtml}
      <div class="product-info__actions">
        <button class="btn btn-primary btn-full btn-lg" id="addToCartBtn" onclick="handleAddToCart()" ${!product.inStock ? 'disabled' : ''}>
          ${addBtnText}
        </button>
        <a href="shop.html" class="btn btn-outline btn-full">← Back to Shop</a>
      </div>
      <div class="product-info__desc" style="padding-top:var(--s5)">
        <div class="hallmark-row">
          <span>THCD / EDITION 001</span>
          <span>·</span>
          <span>${product.hallmark}</span>
          <span>·</span>
          <span>${product.materialTag === 'gold' ? 'GOLD VERMEIL' : 'STERLING SILVER'}</span>
        </div>
      </div>
      ${!product.inStock ? `
      <div class="alert alert-error" style="margin-top:var(--s5)">
        <span>⚠</span>
        <span>This piece is sold out. Edition 001 is limited — no restocks.</span>
      </div>` : ''}
    </div>`;

  document.getElementById('productLayout').innerHTML = buildGallery() + infoHtml;

  function handleAddToCart() {
    const ok = addToCart(product.id, null);
    if (ok) {
      showToast(`${product.name} — Added to cart`);
      const btn = document.getElementById('addToCartBtn');
      if (btn) {
        btn.classList.add('add-success');
        btn.textContent = 'In Cart — View Cart ↗';
        btn.onclick = () => window.location.href = 'cart.html';
      }
    } else {
      showToast('Already in cart');
      const btn = document.getElementById('addToCartBtn');
      if (btn) {
        btn.textContent = 'In Cart — View Cart ↗';
        btn.onclick = () => window.location.href = 'cart.html';
      }
    }
  }

  // Related products (same category, different id)
  const related = PRODUCTS.filter(p => p.id !== product.id && p.category === product.category).slice(0, 4);
  if (related.length === 0) {
    // fallback: just show other products
    const fallback = PRODUCTS.filter(p => p.id !== product.id).slice(0, 4);
    renderRelated(fallback);
  } else {
    renderRelated(related);
  }

  function renderRelated(items) {
    if (!items.length) return;
    const section = document.getElementById('relatedSection');
    section.style.display = 'block';
    document.getElementById('relatedGrid').innerHTML = items.map(p => `
      <article class="product-card" onclick="location.href='product.html?id=${p.id}'" style="cursor:pointer">
        <div class="product-card__image">
          <img src="${getImagePath(p.id, p.images[0])}" alt="${p.name}" loading="lazy"/>
          <div class="product-card__status">
            ${p.inStock ? '<span class="tag tag-acid">In Stock</span>' : '<span class="tag tag-dim">Sold Out</span>'}
          </div>
        </div>
        <div class="product-card__body">
          ${p.materialTag === 'gold' ? '<span class="tag tag-gold">Gold Vermeil</span>' : '<span class="tag tag-silver">Sterling Silver</span>'}
          <h3 class="t-card">${p.name}</h3>
        </div>
        <div class="product-card__footer">
          <span class="t-price">€${p.price}</span>
          <a href="product.html?id=${p.id}" class="btn btn-dark btn-sm">View ↗</a>
        </div>
      </article>`).join('');
  }
}

// Expose to global scope
window.setImage = setImage;
window.prevImg = prevImg;
window.nextImg = nextImg;
window.handleAddToCart = handleAddToCart;

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  container.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2800);
}

document.getElementById('hamburger')?.addEventListener('click', () => {
  document.getElementById('mobileNav').classList.add('open');
});
document.getElementById('mobileClose')?.addEventListener('click', () => {
  document.getElementById('mobileNav').classList.remove('open');
});
</script>
</body>
